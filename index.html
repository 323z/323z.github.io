<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Harry Lou!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
            overflow-x: hidden;
        }
        
        .section {
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        .section.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 标题部分样式 */
        .title-section {
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.7)), 
                        url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1089&q=80') no-repeat center center;
            background-size: cover;
            text-align: center;
        }
        
        .title {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            animation: titleAppear 2s ease forwards;
        }
        
        .title-line {
            display: block;
            margin-bottom: 15px;
        }
        
        @keyframes titleAppear {
            0% {
                opacity: 0;
                transform: translateY(-30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 下滑1样式 - 日历翻页效果 */
        .year-section {
            background-color: #f9f9f9;
        }
        
        .content-box {
            max-width: 800px;
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        
        .content-title {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 30px;
            color: #444;
        }
        
        .calendar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
        
        .calendar {
            width: 300px;
            height: 300px;
            perspective: 1000px;
            position: relative;
        }
        
        .calendar-page {
            width: 100%;
            height: 100%;
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backface-visibility: hidden;
            transition: transform 1s;
            transform-style: preserve-3d;
        }
        
        .calendar-front {
            z-index: 2;
        }
        
        .calendar-back {
            transform: rotateY(180deg);
            z-index: 1;
        }
        
        .calendar.flip .calendar-front {
            transform: rotateY(-180deg);
        }
        
        .calendar.flip .calendar-back {
            transform: rotateY(0deg);
        }
        
        .calendar-month {
            font-size: 2.2rem;
            color: #ff7e5f;
            margin-bottom: 10px;
        }
        
        .calendar-date {
            font-size: 6rem;
            font-weight: 700;
            color: #333;
            line-height: 1;
        }
        
        .calendar-year {
            font-size: 2.5rem;
            color: #666;
            margin-top: 10px;
        }
        
        .time-display {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #777;
            font-weight: 300;
        }
        
        /* 下滑2和下滑3样式 */
        .memory-section {
            background-color: white;
        }
        
        .friendship-section {
            background-color: #f9f9f9;
        }
        
        .image-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            z-index: 0;
        }
        
        .content-box {
            position: relative;
            z-index: 1;
        }
        
        .days-counter {
            font-size: 3.5rem;
            color: #ff7e5f;
            font-weight: 700;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        /* 结尾部分样式 */
        .ending-section {
            background: linear-gradient(135deg, #fdfcfb 0%, #f9f9f9 100%);
        }
        
        .ending-title {
            font-size: 4rem;
            font-weight: 300;
            margin-bottom: 10px;
            color: #333;
        }
        
        .signature {
            font-size: 1.8rem;
            font-weight: 300;
            color: #666;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        
        .btn {
            background-color: #ff7e5f;
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.3);
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 30px;
        }
        
        .btn:hover {
            background-color: #ff6b47;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.4);
        }
        
        .btn i {
            margin-left: 10px;
        }
        
        /* 导航指示器 */
        .scroll-indicator {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }
        
        .indicator-dot {
            width: 12px;
            height: 12px;
            background-color: #ddd;
            border-radius: 50%;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator-dot.active {
            background-color: #ff7e5f;
            transform: scale(1.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .title {
                font-size: 3.2rem;
            }
            
            .content-title {
                font-size: 2rem;
            }
            
            .ending-title {
                font-size: 3rem;
            }
            
            .calendar {
                width: 250px;
                height: 250px;
            }
            
            .calendar-date {
                font-size: 5rem;
            }
            
            .days-counter {
                font-size: 2.8rem;
            }
        }
        
        @media (max-width: 480px) {
            .title {
                font-size: 2.5rem;
            }
            
            .content-title {
                font-size: 1.8rem;
            }
            
            .content-box {
                padding: 25px 20px;
            }
            
            .calendar {
                width: 220px;
                height: 220px;
            }
            
            .calendar-date {
                font-size: 4rem;
            }
            
            .days-counter {
                font-size: 2.2rem;
            }
        }
        
        /* 滚动提示 */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #999;
            font-size: 0.9rem;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }
    </style>
</head>
<body>
    <!-- 标题部分 -->
    <section id="title-section" class="section title-section active">
        <h1 class="title">
            <span class="title-line">TO:</span>
            <span class="title-line">Henry Lou</span>
            <span class="title-line">Happy Birthday!</span>
        </h1>
        <div class="scroll-hint">向下滑动</div>
    </section>
    
    <!-- 下滑1：年份和日历 -->
    <section id="year-section" class="section year-section">
        <div class="content-box">
            <h2 class="content-title">今年是2026年，是你的第14个生日</h2>
            <div class="calendar-container">
                <div class="calendar" id="calendar">
                    <div class="calendar-page calendar-front">
                        <div class="calendar-month" id="current-month">January</div>
                        <div class="calendar-date" id="current-date">1</div>
                        <div class="calendar-year">2026</div>
                    </div>
                    <div class="calendar-page calendar-back">
                        <div class="calendar-month" id="next-month">February</div>
                        <div class="calendar-date" id="next-date">1</div>
                        <div class="calendar-year">2026</div>
                    </div>
                </div>
            </div>
            <div class="time-display" id="time-display">正在加载时间...</div>
        </div>
    </section>
    
    <!-- 下滑2：相识天数 -->
    <section id="memory-section" class="section memory-section">
        <!-- 背景图片占位 - 用户需要替换为两人干杯的图片 -->
        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1169&q=80" alt="两人干杯" class="image-bg">
        <div class="content-box">
            <h2 class="content-title">今天是我们相识的第<span class="days-counter" id="days-counter">0</span>天</h2>
            <p style="font-size: 1.5rem; line-height: 1.8; color: #555; max-width: 700px; margin-top: 20px;">
                在这<span id="days-text">0</span>天里，我们度过了最难忘的时光。<br>
                从初次见面的陌生到如今的熟悉，<br>
                每一段回忆都值得珍藏。
            </p>
        </div>
    </section>
    
    <!-- 下滑3：兄弟情谊 -->
    <section id="friendship-section" class="section friendship-section">
        <!-- 背景图片占位 - 用户需要替换为兄弟干杯的图片 -->
        <img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1170&q=80" alt="兄弟干杯" class="image-bg">
        <div class="content-box">
            <h2 class="content-title">尽管难免会有分歧，但我们仍然是兄弟</h2>
            <p style="font-size: 1.5rem; line-height: 1.8; color: #555; max-width: 700px; margin-top: 30px;">
                真正的友谊不是从不争吵，<br>
                而是在争吵后依然能够相互理解，<br>
                在困难时依然能够并肩前行。
            </p>
        </div>
    </section>
    
    <!-- 结尾部分 -->
    <section id="ending-section" class="section ending-section">
        <div class="content-box">
            <h2 class="ending-title">生日快乐！</h2>
            <div class="signature">---Your best friend.</div>
            <!-- 按钮跳转至GitHub仓库主页 -->
            <button class="btn" id="github-btn">
                收下祝福 <i class="fas fa-heart"></i>
            </button>
        </div>
    </section>
    
    <!-- 导航指示器 -->
    <div class="scroll-indicator">
        <div class="indicator-dot active" data-section="title-section"></div>
        <div class="indicator-dot" data-section="year-section"></div>
        <div class="indicator-dot" data-section="memory-section"></div>
        <div class="indicator-dot" data-section="friendship-section"></div>
        <div class="indicator-dot" data-section="ending-section"></div>
    </div>
    
    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. 计算相识天数（从2024年9月1日开始）
            function calculateDaysSince() {
                const startDate = new Date('2024-09-01');
                const currentDate = new Date();
                // 计算时间差（毫秒）
                const timeDiff = currentDate - startDate;
                // 转换为天数
                const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                return daysDiff;
            }
            
            // 更新相识天数显示
            const daysCounter = document.getElementById('days-counter');
            const daysText = document.getElementById('days-text');
            const daysSince = calculateDaysSince();
            daysCounter.textContent = daysSince;
            daysText.textContent = daysSince;
            
            // 2. 实现日历翻页效果和实时时间显示
            const calendar = document.getElementById('calendar');
            const currentMonthEl = document.getElementById('current-month');
            const currentDateEl = document.getElementById('current-date');
            const nextMonthEl = document.getElementById('next-month');
            const nextDateEl = document.getElementById('next-date');
            const timeDisplay = document.getElementById('time-display');
            
            // 月份名称数组
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            
            function updateDateTime() {
                const now = new Date();
                
                // 更新日历
                const currentMonth = monthNames[now.getMonth()];
                const currentDate = now.getDate();
                const currentYear = now.getFullYear();
                
                // 计算下一天
                const nextDay = new Date(now);
                nextDay.setDate(now.getDate() + 1);
                const nextMonth = monthNames[nextDay.getMonth()];
                const nextDate = nextDay.getDate();
                const nextYear = nextDay.getFullYear();
                
                currentMonthEl.textContent = currentMonth;
                currentDateEl.textContent = currentDate;
                nextMonthEl.textContent = nextMonth;
                nextDateEl.textContent = nextDate;
                
                // 更新时间显示
                const timeString = now.toLocaleString('zh-CN', {
                    timeZone: 'Asia/Shanghai',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    weekday: 'long',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                
                timeDisplay.textContent = `中国标准时间: ${timeString}`;
                
                // 每分钟触发一次日历翻页动画
                if (now.getSeconds() === 0) {
                    calendar.classList.add('flip');
                    setTimeout(() => {
                        calendar.classList.remove('flip');
                    }, 1000);
                }
            }
            
            // 初始更新
            updateDateTime();
            // 每秒更新一次时间
            setInterval(updateDateTime, 1000);
            
            // 3. 实现滚动时的淡入淡出效果
            const sections = document.querySelectorAll('.section');
            const indicatorDots = document.querySelectorAll('.indicator-dot');
            
            // Intersection Observer API 用于检测元素是否进入视口
            const observerOptions = {
                root: null, // 相对于视口
                threshold: 0.3, // 当30%的元素可见时触发
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // 添加active类以触发淡入动画
                        entry.target.classList.add('active');
                        
                        // 更新导航指示器
                        const currentSectionId = entry.target.id;
                        indicatorDots.forEach(dot => {
                            dot.classList.remove('active');
                            if (dot.dataset.section === currentSectionId) {
                                dot.classList.add('active');
                            }
                        });
                    }
                });
            }, observerOptions);
            
            // 观察所有部分（除了第一个已激活的）
            sections.forEach((section, index) => {
                if (index > 0) {
                    observer.observe(section);
                }
            });
            
            // 4. 导航指示器点击功能
            indicatorDots.forEach(dot => {
                dot.addEventListener('click', function() {
                    const targetSectionId = this.dataset.section;
                    const targetSection = document.getElementById(targetSectionId);
                    
                    // 滚动到目标部分
                    targetSection.scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });
            
            // 5. 按钮点击跳转到GitHub仓库
            const githubBtn = document.getElementById('github-btn');
            githubBtn.addEventListener('click', function() {
                // 替换为实际的GitHub仓库URL
                window.open('https://github.com/323z/323z.github.io', '_blank');
            });
            
            // 6. 添加滚动提示功能
            let isScrolling = false;
            window.addEventListener('wheel', function(e) {
                if (isScrolling) return;
                
                isScrolling = true;
                
                // 判断滚动方向
                const delta = e.deltaY;
                const currentSectionIndex = Array.from(sections).findIndex(section => {
                    const rect = section.getBoundingClientRect();
                    return rect.top >= 0 && rect.top <= window.innerHeight / 2;
                });
                
                let targetSectionIndex;
                if (delta > 0 && currentSectionIndex < sections.length - 1) {
                    // 向下滚动
                    targetSectionIndex = currentSectionIndex + 1;
                } else if (delta < 0 && currentSectionIndex > 0) {
                    // 向上滚动
                    targetSectionIndex = currentSectionIndex - 1;
                } else {
                    isScrolling = false;
                    return;
                }
                
                // 滚动到目标部分
                sections[targetSectionIndex].scrollIntoView({
                    behavior: 'smooth'
                });
                
                // 防止连续滚动
                setTimeout(() => {
                    isScrolling = false;
                }, 800);
            });
        });
    </script>
</body>
</html>
